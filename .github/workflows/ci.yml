name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          { POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 5s
          --health-timeout 3s --health-retries 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env: { DATABASE_URL: "postgresql://relay:relay@localhost:5432/relay" }
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env: { DATABASE_URL: "postgresql://relay:relay@localhost:5432/relay" }
      - run: pnpm eval
      - run: pnpm build
      - run: docker build -f infra/docker/api.Dockerfile -t relay-api:test .
      - run: docker build -f infra/docker/web.Dockerfile -t relay-web:test .
