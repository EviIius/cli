services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes:
      - relay_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["relay_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
      AUTH_MODE: required
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-before-deploying}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-disabled}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PROMPTS_DIR: /app/packages/prompts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["4100:4100"]
    volumes: ["relay_prompts:/app/packages/prompts"]
    restart: unless-stopped
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on: [api]
    ports: ["8080:80"]
    restart: unless-stopped
  otel-collector:
    profiles: ["observability", "app"]
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
    depends_on: [jaeger]
  jaeger:
    profiles: ["observability", "app"]
    image: jaegertracing/all-in-one:1.68.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]
volumes:
  relay_postgres:
  relay_redis:
  relay_prompts:
