apiVersion: v1
kind: Namespace
metadata: { name: relay }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: relay-config, namespace: relay }
data:
  AUTH_MODE: required
  PORT: "4100"
  RATE_LIMIT_MAX: "120"
  RATE_LIMIT_WINDOW: 1 minute
  OTEL_SERVICE_NAME: relay-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOCAL_BASE_URL: disabled
  PROMPTS_DIR: /data/prompts
  CORS_ALLOWED_ORIGINS: https://relay.example.com
