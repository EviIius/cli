apiVersion: apps/v1
kind: Deployment
metadata: { name: relay-api, namespace: relay }
spec:
  replicas: 2
  selector: { matchLabels: { app: relay-api } }
  template:
    metadata: { labels: { app: relay-api } }
    spec:
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 1000,
          fsGroup: 1000,
          seccompProfile: { type: RuntimeDefault },
        }
      initContainers:
        - name: initialize-prompts
          image: relay-api:latest
          command:
            [
              "sh",
              "-c",
              "test -f /data/prompts/registry.json || cp -R /app/packages/prompts/. /data/prompts/",
            ]
          volumeMounts: [{ name: prompts, mountPath: /data/prompts }]
      containers:
        - name: api
          image: relay-api:latest
          ports: [{ containerPort: 4100 }]
          envFrom:
            [
              { configMapRef: { name: relay-config } },
              { secretRef: { name: relay-secrets } },
            ]
          readinessProbe:
            {
              httpGet: { path: /ready, port: 4100 },
              initialDelaySeconds: 5,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health, port: 4100 },
              initialDelaySeconds: 15,
              periodSeconds: 20,
            }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: prompts, mountPath: /data/prompts }]
      volumes:
        - name: prompts
          persistentVolumeClaim: { claimName: relay-prompts }
---
apiVersion: v1
kind: Service
metadata: { name: relay-api, namespace: relay }
spec:
  selector: { app: relay-api }
  ports: [{ port: 4100, targetPort: 4100 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: relay-api, namespace: relay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: relay-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: relay-prompts, namespace: relay }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 1Gi } }
