services:
  ollama:
    image: ollama/ollama:0.32.3
    volumes: ["relay_ollama:/root/.ollama"]
    ports: ["11435:11434"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ollama-pull:
    image: ollama/ollama:0.32.3
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    command: ["pull", "${LOCAL_MODEL:-qwen3:8b}"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"
  api:
    environment:
      LOCAL_BASE_URL: http://ollama:11434/v1
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:8b}
      LOCAL_API_KEY: ollama
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
volumes:
  relay_ollama:
